# DSH Adaptive Loop modes bundle, applied as one insert over the profile's
# empty root. Later bundle patches and the profile's own cordis.patch.yml
# address these rows by id, with the last write winning per row.
#
# Run mode (evidence recording) is the default posture: enabled here. The
# improvement-mode workbench tools and HMR candidate coordinator ship disabled;
# a workbench profile enables and configures their rows in its own layer:
#
#   - id: dal-improve-tools
#     name: '@lunarmoon26/dal-improve-tools'
#   - id: dal-hmr-candidate
#     name: '@lunarmoon26/dal-hmr-candidate'
#     config: # workspaceRoot, entry, files, approvalScope, dshVersion, profile
#
# Mounting this bundle into a profile is an approval-gated
# install_or_mount_plugin operation.

- insert:
    - id: dal-run-record
      name: '@lunarmoon26/dal-run-record'
      config:
        storeRoot: .dal/runs

    - id: dal-improve-tools
      name: '@lunarmoon26/dal-improve-tools'
      disabled: true

    - id: dal-hmr-candidate
      name: '@lunarmoon26/dal-hmr-candidate'
      disabled: true

    # G2 optimization candidate. Source-only and disabled: mounting this row
    # and applying the candidate require their own exact approvals.
    - id: dal-unknown-effect-guard
      name: '@lunarmoon26/dal-unknown-effect-guard'
      disabled: true
