# Explicit auth-only invocation; installing the package does not apply this patch.
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- id: agent-loop
  disabled: true
- id: settings
  disabled: true
- id: session-title-llm
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: hmr
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  config:
    providers: {}
- insert:
    - id: dal-codex-authorization
      name: '@deepseek-ai/dsh-authorization'
    - id: dal-codex-oauth
      name: '@lunarmoon26/dal-codex-oauth'
      config:
        timeoutMs: 300000
        dalWorktree: !!js process.env.DAL_WORKTREE
        approvalFile: !!js process.env.DAL_CODEX_OAUTH_APPROVAL
        manifestFile: !!js process.env.DAL_CODEX_OAUTH_MANIFEST
